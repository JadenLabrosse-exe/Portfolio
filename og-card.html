<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Limelight&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 90px;
    background: #111827;          /* swap in your site's background color */
    color: #ffffff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .text h3 { font-size: 36px; font-weight: 400; opacity: .8; }
  .text h1 { font-family: 'Limelight', cursive; font-size: 88px; line-height: 1.1; margin: 10px 0; }
  .text span { font-size: 40px; color: #38bdf8; }  /* swap in your accent color */
  .text p { margin-top: 30px; font-size: 28px; opacity: .7; }
  img {
    width: 380px;
    height: 380px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;   /* keeps your face in frame */
    border: 6px solid #38bdf8;
  }
</style>
</head>
<body>
  <div class="text">
    <h3>Hi, I'm</h3>
    <h1>Jaden LaBrosse</h1>
    <span>Software Developer</span>
    <p>jadenlabrosse.dev</p>
  </div>
  <img src="Jaden.jpg" alt="">
</body>
</html>
